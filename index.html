<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Plates</title>
<style>
:root{color-scheme:dark;--bg:#0f1115;--card:#1a1d24;--line:#272b35;--tx:#e8eaf0;--mut:#8b91a0;--ac:#4f8cff;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:18px;font-weight:600;margin:4px 0 14px;display:flex;justify-content:space-between;align-items:baseline}
h1 em{font-style:normal;font-size:12px;color:var(--ac);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
h1 span{color:var(--mut);font-size:14px;font-weight:400}
button{font-family:inherit}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;padding:9px;border:0;border-radius:9px;background:none;color:var(--mut);font-size:15px;font-weight:500}
.seg button.on{background:var(--ac);color:#fff}
.cam{position:relative;margin-bottom:10px;border-radius:14px;overflow:hidden;background:#000;display:none;aspect-ratio:3.2/1}
.cam video{position:absolute;top:50%;transform:translateY(-50%)}
.box{position:absolute;inset:0;border:3px solid var(--ac);border-radius:14px;pointer-events:none;transition:border-color .2s}
.box.ok{border-color:#3ddc84}
.scan{display:block;width:100%;padding:18px;border:0;border-radius:14px;background:var(--ac);color:#fff;font-size:17px;font-weight:600}
.scan[disabled]{opacity:.6}
.hold{display:block;width:100%;margin-top:8px;padding:22px;border:2px solid var(--ac);border-radius:14px;background:var(--card);color:var(--tx);font-size:17px;font-weight:600;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.hold.on{background:#1f6b45;border-color:#3ddc84}
.hold[hidden]{display:none}
.tbtn{display:block;width:100%;margin-top:8px;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx);font-size:14px}
.tbtn[hidden]{display:none}
.pend{background:var(--card);border:1px solid var(--ac);border-radius:12px;padding:12px;margin-bottom:10px}
.pend[hidden]{display:none}
.pend div:first-child{font-size:14px;margin-bottom:8px}
.prow{display:flex;gap:8px}
.prow button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:14px;font-weight:600}
.prow .pri{background:var(--ac);border-color:var(--ac);color:#fff}
.rsave{padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--mut);font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:#2a2f3a;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88%;text-align:center;z-index:50;border:1px solid var(--line)}
#toast.show{opacity:1;transform:translateX(-50%)}
.alt{display:none}
#ctl{display:flex;flex-direction:column}
#ctl .cam{order:1}#ctl .scan{order:2}#ctl .hold{order:3}#ctl .tbtn{order:4}#ctl .shut{order:5}#ctl .done{order:6}
#ctl.batch .done{order:1;margin:0 0 10px}
#ctl.batch .cam{order:2}
#ctl.batch .shut{order:3}
#ctl.batch .tbtn{order:4}
#ctl.batch .scan{order:5;margin-top:8px}
.shut{display:block;width:100%;margin-top:8px;padding:22px;border:0;border-radius:14px;background:var(--ac);color:#fff;font-size:18px;font-weight:700}
.shut:active{filter:brightness(.85)}
.done{display:block;width:100%;margin-top:8px;padding:14px;border:1px solid var(--ac);border-radius:12px;background:var(--card);color:var(--tx);font-size:15px;font-weight:600}
.done[disabled]{opacity:.4}
.shut[hidden],.done[hidden],#res[hidden],#mainview[hidden]{display:none}
.rhead{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px}
.rhead b{font-size:16px}
#rmsg{color:var(--mut);font-size:14px;min-height:20px;margin:0 2px 10px}
.rrow{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;align-items:center}
.rrow.ok{border-color:#2e7d52}
.rimg{width:46%;flex:none;border-radius:8px;background:#000;display:block}
.rside{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rst{font-size:13px;color:var(--mut)}
.rst.good{color:#3ddc84}
.rin{width:100%;min-width:0;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:600 17px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;text-transform:uppercase}
.rin:focus{outline:0;border-color:var(--ac)}
.rin:disabled{opacity:.6}
.rbtn{padding:9px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:14px;font-weight:600}
.rbtn[disabled]{opacity:.35}
.rfoot{display:flex;gap:8px;margin-top:12px}
.rfoot button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:15px;font-weight:500}
.rfoot .pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.add{display:flex;gap:8px;margin:0 0 12px}
.add input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:600 17px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;text-transform:uppercase}
.add input:focus{outline:0;border-color:var(--ac)}
.add button{padding:0 18px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:15px;font-weight:600}
.alt{display:block;width:100%;padding:11px;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--mut);font-size:14px}
#msg{min-height:22px;margin:10px 2px;color:var(--mut);font-size:14px}
#dbg{color:var(--mut);font-size:12px;margin:-6px 2px 8px;min-height:14px}
#msg.err{color:var(--bad)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
li input{font:600 20px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;flex:1;min-width:0;width:100%;background:none;border:0;border-bottom:1px dashed transparent;color:var(--tx);padding:2px 0;text-transform:uppercase}
li input:focus{outline:0;border-bottom-color:var(--ac)}
li button{background:none;border:0;color:var(--mut);font-size:20px;padding:4px 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.row button{flex:1 1 40%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:15px;font-weight:500}
.row .clr{color:var(--bad)}
.empty{color:var(--mut);text-align:center;padding:28px 0}
</style>
</head>
<body>
<main>
<h1><div>Plates <em id="ver">v16</em></div><span id="count"></span></h1>
<div id="mainview">
<div class="pend" id="pend" hidden><div id="pendt"></div><div class="prow"><button id="pendread" class="pri">Read them</button><button id="penddel">Discard</button></div></div>
<div class="seg"><button id="mCar" class="on">Car</button><button id="mMoto">Motorcycle</button></div>
<div class="seg"><button id="tLive" class="on">Live scan</button><button id="tBatch">Batch photos</button></div>
<div id="ctl">
<div class="cam" id="cam"><video id="vid" playsinline muted></video><div class="box" id="box"></div></div>
<button class="scan" id="scan">📷 Start scanning</button>
<button class="hold" id="hold" hidden>✋ Hold to scan</button>
<button class="shut" id="shut" hidden>● Take photo</button>
<button class="done" id="doneb" hidden disabled>✔ Done — read the photos</button>
<button class="tbtn" id="torch" hidden>🔦 Torch: Off</button>
</div>
<div id="msg"></div>
<div id="dbg"></div>
<div class="add"><input id="man" placeholder="Add plate manually" maxlength="8" autocapitalize="characters" autocomplete="off" spellcheck="false"><button id="addb">Add</button></div>
<ul id="list"></ul>
<div class="row" id="actions" hidden>
  <button id="exp">Export Excel</button>
  <button id="txt">Export text</button>
  <button id="copy">Copy</button>
  <button id="clr" class="clr">Clear</button>
</div>
</div>
<div id="res" hidden>
  <div class="rhead"><b>Batch results</b><span id="rcount"></span></div>
  <div id="rmsg"></div>
  <div id="rlist"></div>
  <div class="rfoot"><button id="addall" class="pri">Add all</button><button id="rclose">Close</button></div>
</div>
</main>
<div id="toast" role="status"></div>
<script src="lib/tesseract.min.js"></script>

})}
function dbPut(blob,moto){return idb().then(function(d){return new Promise(function(res,rej){
  var r=d.transaction("shots","readwrite").objectStore("shots").add({blob:blob,moto:moto,t:Date.now()});
  r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};
})})}
function dbAll(){return idb().then(function(d){return new Promise(function(res,rej){
  var r=d.transaction("shots","readonly").objectStore("shots").getAll();
  r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};
})})}
function dbDelete(id){return idb().then(function(d){return new Promise(function(res){
  var r=d.transaction("shots","readwrite").objectStore("shots").delete(id);r.onsuccess=function(){res()};r.onerror=function(){res()};
})}).catch(function(){})}
function dropShot(s){
  var i=shots.indexOf(s);if(i>-1)shots.splice(i,1);free([s.c]);
  Promise.resolve(s.idp).then(function(id){var k=id!=null?id:s.id;if(k!=null)dbDelete(k)});
}
function dbClear(){return idb().then(function(d){return new Promise(function(res){
  var r=d.transaction("shots","readwrite").objectStore("shots").clear();r.onsuccess=function(){res()};r.onerror=function(){res()};
})}).catch(function(){})}
function blobToCanvas(b){return new Promise(function(res,rej){
  var u=URL.createObjectURL(b),i=new Image();
  i.onload=function(){var c=mk(i.naturalWidth,i.naturalHeight);c.getContext("2d").drawImage(i,0,0);URL.revokeObjectURL(u);res(c)};
  i.onerror=rej;i.src=u;
})}
async function restoreShots(){
  try{
    var all=await dbAll();
    for(var k=0;k<all.length;k++){var c=await blobToCanvas(all[k].blob);shots.push({c:c,moto:!!all[k].moto,id:all[k].id})}
  }catch(e){}
  updateShut();updPend();
}
function updPend(){
  var show=shots.length>0&&!live&&$("res").hidden;
  $("pend").hidden=!show;
  if(show)$("pendt").textContent="📷 "+shots.length+" saved photo"+(shots.length>1?"s":"")+" waiting to be read";
}
$("pendread").onclick=function(){if(shots.length)showResults()};
$("penddel").onclick=function(){
  var b=$("penddel");
  if(!b.dataset.c){b.dataset.c=1;b.textContent="Delete? Tap again";setTimeout(function(){b.textContent="Discard";delete b.dataset.c},3000);return}
  delete b.dataset.c;b.textContent="Discard";discardShots();
};
function discardShots(){
  shots.forEach(function(s){free([s.c])});shots=[];dbClear();updateShut();updPend();
}
/* ---- batch results ---- */
var rows=[];
function validPlate(v){return v.length===7}
function cleanPlate(s){return s.toUpperCase().replace(/[^A-Z0-9]/g,"")}
function setType(tp){
  if(live)stopLive();
  scanType=tp;$("tLive").className=tp==="live"?"on":"";$("tBatch").className=tp==="batch"?"on":"";
  $("ctl").className=tp==="batch"?"batch":"";$("torch").textContent=torchLabel();
  $("scan").textContent=tp==="batch"?"📷 Open camera":"📷 Start scanning";msg("");
}
function rmsg(t){$("rmsg").textContent=t||""}
function updRCount(){
  var f=rows.filter(function(r){return r.plate}).length;
  $("rcount").textContent=rows.length+" photos · "+f+" read";
}
function markAdded(r,txt){
  r.added=true;r.inp.disabled=true;r.btn.disabled=true;r.btn.textContent="✓ Added";r.el.className="rrow ok";
  r.st.textContent=txt||"Added to list";r.st.className="rst good";
}
function addRow(r){
  var ok=validPlate(cleanPlate(r.inp.value));
  if(!ok){r.st.textContent="A plate has 7 characters";return}
  var v=cleanPlate(r.inp.value);
  if(addPlate(v))markAdded(r);
  else{r.st.textContent=v+" is already in the list";r.st.className="rst"}
}
function showResults(){
  $("mainview").hidden=true;$("res").hidden=false;updPend();
  var box2=$("rlist");box2.textContent="";rows=[];cancelBatch=false;
  shots.forEach(function(s,i){
    var el=document.createElement("div"),img=document.createElement("img"),side=document.createElement("div"),st=document.createElement("div"),inp=document.createElement("input"),btn=document.createElement("button");
    el.className="rrow";img.className="rimg";
    var tc=mk(360,Math.max(1,Math.round(360*s.c.height/s.c.width)));tc.getContext("2d").drawImage(s.c,0,0,tc.width,tc.height);img.src=tc.toDataURL("image/jpeg",.7);free([tc]);
    side.className="rside";st.className="rst";st.textContent="Waiting…";
    inp.className="rin";inp.maxLength=8;inp.placeholder="type plate";inp.autocapitalize="characters";inp.spellcheck=false;inp.autocomplete="off";
    btn.className="rbtn";btn.textContent="Add";btn.disabled=true;
    var r={el:el,st:st,inp:inp,btn:btn,plate:null,added:false,s:s};
    inp.oninput=function(){btn.disabled=r.added||!validPlate(cleanPlate(inp.value))};
    btn.onclick=function(){addRow(r)};
    var sv=document.createElement("button");sv.className="rsave";sv.textContent="💾 Save photo";
    sv.onclick=function(){savePhoto(r,sv)};
    side.append(st,inp,btn,sv);el.append(img,side);box2.append(el);rows.push(r);
  });
  updRCount();rmsg("Reading photos…");
  analyzeAll();
}
async function analyzeAll(){
  for(var i=0;i<rows.length&&!cancelBatch;i++){
    var r=rows[i];r.st.textContent="Reading…";
    var p=null;
    try{
      var v=await Promise.race([readFrame(r.s.c,0,0,r.s.c.width,r.s.c.height,r.s.moto),sleep(15000).then(function(){throw new Error("slow")})]);
      p=v&&v[0]||null;
    }catch(e){if(e&&e.message==="slow")await resetWorkers()}
    if(cancelBatch)return;
    if(p){r.plate=p;r.inp.value=p;r.st.textContent="Plate found — check it";r.st.className="rst good";r.btn.disabled=false}
    else{r.st.textContent="No plate found — type it or skip";r.st.className="rst";}
    updRCount();
    if(recCount>250)await resetWorkers();
    await sleep(20);
  }
  if(!cancelBatch){var f=rows.filter(function(x){return x.plate}).length;rmsg(f+" of "+rows.length+" photos read. Check, edit if needed, then tap Add.")}
}
async function savePhoto(r,btn){
  try{
    var b=await new Promise(function(res){r.s.c.toBlob(res,"image/jpeg",.92)});
    if(!b)throw new Error("no blob");
    var f=new File([b],"plate-"+Date.now()+".jpg",{type:"image/jpeg"}),a=document.createElement("a");
    a.href=URL.createObjectURL(f);a.download=f.name;document.body.append(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
    btn.textContent="✓ Saved";toast("Photo saved. Look in Downloads in your gallery");
  }catch(e){toast("Could not save the photo")}
}
function addAllRows(){
  var n=0,dup=0;
  rows.forEach(function(r){if(r.added)return;var v=cleanPlate(r.inp.value);if(!validPlate(v))return;if(addPlate(v)){markAdded(r);n++}else dup++});
  var done=rows.filter(function(r){return r.added});
  if(!done.length){rmsg(dup?"Those plates are already in the list":"Nothing to add yet. Read or type a plate first");return}
  var left=rows.length-done.length;
  cancelBatch=true;done.forEach(function(r){dropShot(r.s)});
  rows=[];$("rlist").textContent="";$("res").hidden=true;$("mainview").hidden=false;
  updateShut();updPend();msg("");render();
  toast("Added "+n+" plate"+(n!==1?"s":"")+(dup?" ("+dup+" already in list)":"")+(left?" · "+left+" photo"+(left>1?"s":"")+" kept":""));
  var l=$("list");if(l&&l.scrollIntoView)l.scrollIntoView({behavior:"smooth",block:"start"});
}
function closeResults(force){
  var pending=rows.some(function(r){return !r.added});
  var b=$("rclose");
  if(pending&&!force&&!b.dataset.c){b.dataset.c=1;b.textContent="Delete photos? Tap again";setTimeout(function(){b.textContent="Close";delete b.dataset.c},3000);return}
  cancelBatch=true;delete b.dataset.c;b.textContent="Close";
  rows=[];$("rlist").textContent="";discardShots();
  $("res").hidden=true;$("mainview").hidden=false;msg("");updPend();
}
$("tLive").onclick=function(){setType("live")};
$("tBatch").onclick=function(){setType("batch")};
$("shut").onclick=shoot;
$("doneb").onclick=function(){if(!shots.length)return;stopLive();showResults()};
$("addall").onclick=addAllRows;
$("rclose").onclick=function(){closeResults(false)};
var hb=$("hold");
hb.addEventListener("pointerdown",function(e){e.preventDefault();try{hb.setPointerCapture(e.pointerId)}catch(_){}setHold(true)});
["pointerup","pointercancel","lostpointercapture"].forEach(function(n){hb.addEventListener(n,function(){setHold(false)})});
hb.addEventListener("contextmenu",function(e){e.preventDefault()});
window.addEventListener("resize",layout);
document.addEventListener("visibilitychange",function(){if(document.hidden&&live)stopLive()});
render();restoreShots();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
</html>
