<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Plates</title>
<style>
:root{color-scheme:dark;--bg:#0f1115;--card:#1a1d24;--line:#272b35;--tx:#e8eaf0;--mut:#8b91a0;--ac:#4f8cff;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:18px;font-weight:600;margin:4px 0 14px;display:flex;justify-content:space-between;align-items:baseline}
h1 em{font-style:normal;font-size:12px;color:var(--ac);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
h1 span{color:var(--mut);font-size:14px;font-weight:400}
button{font-family:inherit}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;padding:9px;border:0;border-radius:9px;background:none;color:var(--mut);font-size:15px;font-weight:500}
.seg button.on{background:var(--ac);color:#fff}
.cam{position:relative;margin-bottom:10px;border-radius:14px;overflow:hidden;background:#000;display:none;aspect-ratio:3.2/1}
.cam video{position:absolute;top:50%;transform:translateY(-50%)}
.box{position:absolute;inset:0;border:3px solid var(--ac);border-radius:14px;pointer-events:none;transition:border-color .2s}
.box.ok{border-color:#3ddc84}
.scan{display:block;width:100%;padding:18px;border:0;border-radius:14px;background:var(--ac);color:#fff;font-size:17px;font-weight:600}
.scan[disabled]{opacity:.6}
.hold{display:block;width:100%;margin-top:8px;padding:22px;border:2px solid var(--ac);border-radius:14px;background:var(--card);color:var(--tx);font-size:17px;font-weight:600;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.hold.on{background:#1f6b45;border-color:#3ddc84}
.hold[hidden]{display:none}
.tbtn{display:block;width:100%;margin-top:8px;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx);font-size:14px}
.tbtn[hidden]{display:none}
.add{display:flex;gap:8px;margin:0 0 12px}
.add input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:600 17px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;text-transform:uppercase}
.add input:focus{outline:0;border-color:var(--ac)}
.add button{padding:0 18px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:15px;font-weight:600}
.alt{display:block;width:100%;padding:11px;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--mut);font-size:14px}
input[type=file]{display:none}
#msg{min-height:22px;margin:10px 2px;color:var(--mut);font-size:14px}
#dbg{color:var(--mut);font-size:12px;margin:-6px 2px 8px;min-height:14px}
#msg.err{color:var(--bad)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
li input{font:600 20px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;flex:1;min-width:0;width:100%;background:none;border:0;border-bottom:1px dashed transparent;color:var(--tx);padding:2px 0;text-transform:uppercase}
li input:focus{outline:0;border-bottom-color:var(--ac)}
li button{background:none;border:0;color:var(--mut);font-size:20px;padding:4px 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.row button{flex:1 1 40%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:15px;font-weight:500}
.row .clr{color:var(--bad)}
.empty{color:var(--mut);text-align:center;padding:28px 0}
</style>
</head>
<body>
<main>
<h1><div>Plates <em id="ver">v11</em></div><span id="count"></span></h1>
<div class="seg"><button id="mCar" class="on">Car</button><button id="mMoto">Motorcycle</button></div>
<div class="cam" id="cam"><video id="vid" playsinline muted></video><div class="box" id="box"></div></div>
<button class="scan" id="scan">📷 Start scanning</button>
<button class="hold" id="hold" hidden>✋ Hold to scan</button>
<button class="tbtn" id="torch" hidden>🔦 Torch: Off</button>
<button class="alt" id="photo">or pick / take a photo instead</button>
<input type="file" id="file" accept="image/*" capture="environment">
<div id="msg"></div>
<div id="dbg"></div>
<div class="add"><input id="man" placeholder="Add plate manually" maxlength="8" autocapitalize="characters" autocomplete="off" spellcheck="false"><button id="addb">Add</button></div>
<ul id="list"></ul>
<div class="row" id="actions" hidden>
  <button id="exp">Export Excel</button>
  <button id="txt">Export text</button>
  <button id="copy">Copy</button>
  <button id="clr" class="clr">Clear</button>
</div>
</main>
<script src="lib/tesseract.min.js"></script>

  for(i=0;i<n;i++){v=a[i*4]*.299+a[i*4+1]*.587+a[i*4+2]*.114;gr[i]=v;hist[v|0]++}
  var lo=0,hi=255,acc=0;
  for(i=0;i<256;i++){acc+=hist[i];if(acc>n*.02){lo=i;break}}
  acc=0;for(i=255;i>=0;i--){acc+=hist[i];if(acc>n*.02){hi=i;break}}

/* local-threshold ink (optionally blurred + closed) and its binary canvas */
function inkFrom(G,blur,close){
  var w=G.w,h=G.h,n=w*h,i,sm=blur?boxBlur(G.gr,w,h,blur):G.gr,ink=adaptive(sm,w,h);
  if(close)ink=closeInk(ink,w,h,close);
  var cb=mk(w,h),gb=cb.getContext("2d"),d2=gb.createImageData(w,h),b=d2.data;
  for(i=0;i<n;i++){b[i*4]=b[i*4+1]=b[i*4+2]=ink[i]?0:255;b[i*4+3]=255}
  gb.putImageData(d2,0,0);
  return {gray:G.gray,bin:cb,ink:ink,w:w,h:h};
}
function variants(src,sx,sy,sw,sh,tw,moto){return inkFrom(grayCrop(src,sx,sy,sw,sh,tw),moto?0:2,moto?0:3)}
function band(c){var h=Math.round(c.height*.72),o=mk(c.width,h);o.getContext("2d").drawImage(c,0,Math.round(c.height*.14),c.width,h,0,0,c.width,h);return o}
function gcrop(cv,b){
  var bw=b[1]-b[0],bh=b[3]-b[2],px=Math.round(bw*.25),py=Math.round(bh*.2);
  var x0=Math.max(0,b[0]-px),y0=Math.max(0,b[2]-py),x1=Math.min(cv.width,b[1]+px),y1=Math.min(cv.height,b[3]+py);
  var s=70/bh,cw=Math.max(1,Math.round((x1-x0)*s)),ch=Math.max(1,Math.round((y1-y0)*s));
  var o=mk(cw+40,ch+40),g=o.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,o.width,o.height);
  g.imageSmoothingQuality="high";g.drawImage(cv,x0,y0,x1-x0,y1-y0,20,20,cw,ch);return o;
}
function smoothCrop(cv){
  var w=cv.width,h=cv.height,g=cv.getContext("2d"),d=g.getImageData(0,0,w,h),a=d.data,n=w*h,s=new Uint8Array(n),i;
  for(i=0;i<n;i++)s[i]=a[i*4];
  var m=boxBlur(s,w,h,2),o=mk(w,h),og=o.getContext("2d"),d2=og.createImageData(w,h),b=d2.data;
  for(i=0;i<n;i++){var v=m[i]>=128?255:0;b[i*4]=b[i*4+1]=b[i*4+2]=v;b[i*4+3]=255}
  og.putImageData(d2,0,0);return o;
}
/* ---- OCR (two workers in parallel) ---- */
var W=null,P=Tesseract.PSM,recCount=0;
async function resetWorkers(){
  var old=W;W=null;recCount=0;
  if(old)old.forEach(function(w){try{w.terminate()}catch(e){}});
}
async function getWorkers(){
  if(W)return W;
  msg("Loading reader (first time only)…");
  var o={workerPath:"lib/worker.min.js",corePath:"lib/core/",langPath:"lib/lang/",gzip:true,cacheMethod:"none"};
  W=await Promise.all([Tesseract.createWorker("eng",1,o),Tesseract.createWorker("eng",1,o)]);
  return W;
}
async function recMany(wk,crops,wl,type){
  await wk.setParameters({tessedit_pageseg_mode:P.SINGLE_CHAR,tessedit_char_whitelist:wl});
  var o=[];
  for(var i=0;i<crops.length;i++){recCount++;var r=await wk.recognize(crops[i]),tx=(r.data.text||"").trim().toUpperCase().slice(0,1);o.push({t:tx,c:tx?Math.max(r.data.confidence||0,25):0,type:type})}
  return o;
}
/* read the 7 glyphs one by one. Fast pass first; extra image variants only when unsure */
async function readGlyphs(v,B){
  var w=await getWorkers(),K=B.map(function(b){return gcrop(v.bin,b)}),extra=[];
  var R=await Promise.all([recMany(w[0],K,LET,"L"),recMany(w[1],K,DIG,"D")]),all=[R[0],R[1]],i,sure=true;
  for(i=0;i<7;i++){
    var c=pickChar(i,all.map(function(a){return a[i]}));
    if(!c||pickChar.score<80){sure=false;break}
  }
  if(!sure){
    var A=B.map(function(b){return gcrop(v.gray,b)}),C=K.map(smoothCrop);extra=A.concat(C);
    var R2=await Promise.all([
      (async function(){return [await recMany(w[0],A,LET,"L"),await recMany(w[0],C,LET,"L")]})(),
      (async function(){return [await recMany(w[1],A,DIG,"D"),await recMany(w[1],C,DIG,"D")]})()
    ]);
    all=all.concat(R2[0],R2[1]);
  }
  free(K.concat(extra));
  var out="";
  for(i=0;i<7;i++){
    var ch=pickChar(i,all.map(function(a){return a[i]}));
    if(!ch)return null;
    out+=shapeFix(ch,i,v.ink,v.w,B[i]);
  }
  return /^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/.test(out)?out:null;
}
function free(l){l.forEach(function(c){c.width=c.height=0})}
async function readFrame(src,sx,sy,sw,sh,moto){
  var G=grayCrop(src,sx,sy,sw,sh,moto?800:900);lastHi=G.hi;var sets=moto?[[0,0]]:[[2,3]];
  for(var s=0;s<sets.length;s++){
    var v=inkFrom(G,sets[s][0],sets[s][1]),B=glyphBoxes(v.ink,v.w,v.h,moto);
    if(B){var p=await readGlyphs(v,B);if(p){free([G.gray,v.bin]);return [p]}}
    free([v.bin]);
  }
  free([G.gray]);
  return [];
}
function addPlate(p){
  if(items.some(function(i){return i.p===p}))return false;
  items.unshift({p:p,t:Date.now()});save();render();return true;
}
/* ---- camera ---- */
var live=false,holding=false,stream=null,hist=[];
var vid=$("vid"),cam=$("cam"),box=$("box");
function cropRect(vw,vh){
  var ar=mode==="moto"?1.15:3.2,sw=vw*(mode==="moto"?.6:.84),sh=sw/ar;
  if(sh>vh*.92){sh=vh*.92;sw=sh*ar}
  return {sx:(vw-sw)/2,sy:(vh-sh)/2,sw:sw,sh:sh,ar:ar};
}
function layout(){
  var vw=vid.videoWidth||1920,vh=vid.videoHeight||1080,r=cropRect(vw,vh),fw=r.sw/vw;
  cam.style.aspectRatio=r.ar+"/1";
  vid.style.width=(100/fw)+"%";vid.style.left=(-((100/fw-100)/2))+"%";
}
function setMode(m){
  mode=m;$("mCar").className=m==="car"?"on":"";$("mMoto").className=m==="moto"?"on":"";
  hist=[];layout();msg(live?"Switched to "+(m==="car"?"car":"motorcycle")+" mode":"");
}
var torchOK=false,torchOn=false,torchMode="off",torchT=0,lastHi=128;
function torchLabel(){return "🔦 Torch: "+(torchMode==="auto"?"Auto":torchMode==="on"?"On":"Off")}
async function setTorch(on){
  if(!stream||!torchOK||torchOn===on)return;
  try{await stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:on}]});torchOn=on;torchT=Date.now()}catch(e){}
}
function applyTorchMode(){
  $("torch").textContent=torchLabel();
  if(torchMode==="on")setTorch(true);else if(torchMode==="off")setTorch(false);
}
function autoTorch(){
  if(torchMode!=="auto"||!torchOK||Date.now()-torchT<2500)return;
  if(!torchOn&&lastHi<80)setTorch(true);else if(torchOn&&lastHi>215)setTorch(false);
}
function setHold(on){
  if(holding===on)return;holding=on;hist=[];
  $("hold").className="hold"+(on?" on":"");$("hold").textContent=on?"Scanning… keep holding":"✋ Hold to scan";
  if(live)msg(on?"Fill the box with the plate":"Camera ready. Hold the button to scan");
}
async function startLive(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false});
  }catch(e){msg("Camera blocked. Allow camera access, or use the photo option.",true);return}
  vid.srcObject=stream;await vid.play().catch(function(){});
  try{await stream.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:"continuous"}]})}catch(e){}
  try{var cp=stream.getVideoTracks()[0].getCapabilities();torchOK=!!(cp&&cp.torch)}catch(e){torchOK=false}
  torchOn=false;$("torch").hidden=!torchOK;$("torch").textContent=torchLabel();
  cam.style.display="block";layout();
  live=true;hist=[];$("scan").textContent="■ Stop";
  try{await getWorkers()}catch(e){msg("Could not load the reader.",true);stopLive();return}
  $("hold").hidden=false;if(torchOK&&torchMode==="on")setTorch(true);msg("Camera ready. Hold the button to scan");
  loop();
}
function stopLive(){
  live=false;setHold(false);$("dbg").textContent="";$("torch").hidden=true;torchOn=false;$("hold").hidden=true;$("scan").textContent="📷 Start scanning";cam.style.display="none";
  if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
}
async function loop(){
  while(live){
    try{
      var vw=vid.videoWidth,vh=vid.videoHeight;
      if(!vw||!holding){await sleep(80);continue}
      var r=cropRect(vw,vh),t0=Date.now(),votes=await Promise.race([
        readFrame(vid,r.sx,r.sy,r.sw,r.sh,mode==="moto"),
        sleep(10000).then(function(){throw new Error("slow")})
      ]);
      $("dbg").textContent=(Date.now()-t0)+" ms/frame"+(torchOK?" · light "+Math.round(lastHi):"");autoTorch();
      if(recCount>250)await resetWorkers();
      if(!live)break;
      if(!holding){hist=[];continue}
      hist.push(votes);if(hist.length>5)hist.shift();
      var cnt={};hist.forEach(function(h){h.forEach(function(p){cnt[p]=(cnt[p]||0)+1})});
      for(var p in cnt){
        if(cnt[p]>=2){
          hist=[];
          if(addPlate(p)){
            if(navigator.vibrate)navigator.vibrate(120);
            box.classList.add("ok");setTimeout(function(){box.classList.remove("ok")},700);
            msg("Added "+p+" ✓");
          }else msg(p+" already in list");
          await sleep(900);break;
        }
      }
      await sleep(40);
    }catch(e){if(e&&e.message==="slow"){msg("Reader was slow, restarting it…");await resetWorkers()}await sleep(300)}
  }
}
/* ---- single photo ---- */
async function analyze(file){
  if(busy)return;busy=true;$("scan").disabled=true;
  try{
    var w=await getWorkers();msg("Reading photo…");
    var img=await new Promise(function(res,rej){var i=new Image(),u=URL.createObjectURL(file);i.onload=function(){URL.revokeObjectURL(u);res(i)};i.onerror=rej;i.src=u});
    var s=Math.min(1,1600/Math.max(img.width,img.height)),found=[];
    var v=variants(img,0,0,img.width,img.height,Math.round(img.width*s),mode==="moto");
    var moto=mode==="moto",B=glyphBoxes(v.ink,v.w,v.h,moto)||glyphBoxes(v.ink,v.w,v.h,!moto);
    if(B){var p=await readGlyphs(v,B);if(p)found=[p]}
    if(!found.length){
      var wl=LET+DIG;
      var r=await Promise.all([0,1].map(async function(k){await w[k].setParameters({tessedit_pageseg_mode:k?P.SINGLE_BLOCK:P.SPARSE_TEXT,tessedit_char_whitelist:wl});var o=await w[k].recognize(k?v.bin:v.gray);return extract(o.data.text||"",moto)}));
      found=[].concat(r[0],r[1]).filter(function(p,i,a){return a.indexOf(p)===i});
    }
    var added=0;found.forEach(function(p){if(addPlate(p))added++});
    msg(!found.length?"No plate found. Try the live scanner.":added?"Added "+added+" — check it":"Already in list",!found.length);
  }catch(e){msg("Could not read the image.",true)}
  finally{busy=false;$("scan").disabled=false}
}
/* ---- export ---- */
function list(){return items.slice().reverse().map(function(i){return i.p})}
async function sendFile(f){
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}
  catch(e){if(e&&e.name==="AbortError")return}
  var a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;document.body.append(a);a.click();a.remove();
}
$("exp").onclick=function(){
  sendFile(new File([xlsx(list())],"plates.xlsx",{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
};
$("txt").onclick=function(){sendFile(new File([list().join("\r\n")+"\r\n"],"plates.txt",{type:"text/plain"}))};
$("copy").onclick=async function(){
  try{await navigator.clipboard.writeText(list().join("\n"));msg("Copied")}catch(e){msg("Copy failed",true)}
};
$("clr").onclick=function(){
  var b=$("clr");
  if(b.dataset.c){items=[];save();render();b.textContent="Clear";delete b.dataset.c;return}
  b.dataset.c=1;b.textContent="Tap again";
  setTimeout(function(){b.textContent="Clear";delete b.dataset.c},3000);
};
$("scan").onclick=function(){live?stopLive():startLive()};
$("photo").onclick=function(){$("file").click()};
$("file").onchange=function(e){var f=e.target.files[0];e.target.value="";if(f)analyze(f)};
$("mCar").onclick=function(){setMode("car")};
$("mMoto").onclick=function(){setMode("moto")};
function manualAdd(){
  var i=$("man"),v=i.value.toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(v.length!==7){msg("A plate has 7 characters, e.g. ABC1D23",true);return}
  if(addPlate(v)){msg("Added "+v+" ✓");i.value=""}else msg(v+" already in list");
}
$("addb").onclick=manualAdd;
$("man").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();manualAdd()}});
$("torch").onclick=function(){torchMode=torchMode==="off"?"on":torchMode==="on"?"auto":"off";applyTorchMode()};
var hb=$("hold");
hb.addEventListener("pointerdown",function(e){e.preventDefault();try{hb.setPointerCapture(e.pointerId)}catch(_){}setHold(true)});
["pointerup","pointercancel","lostpointercapture"].forEach(function(n){hb.addEventListener(n,function(){setHold(false)})});
hb.addEventListener("contextmenu",function(e){e.preventDefault()});
window.addEventListener("resize",layout);
document.addEventListener("visibilitychange",function(){if(document.hidden&&live)stopLive()});
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
