<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Plates</title>
<style>
:root{color-scheme:dark;--bg:#0f1115;--card:#1a1d24;--line:#272b35;--tx:#e8eaf0;--mut:#8b91a0;--ac:#4f8cff;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:18px;font-weight:600;margin:4px 0 14px;display:flex;justify-content:space-between;align-items:baseline}
h1 em{font-style:normal;font-size:12px;color:var(--ac);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
h1 span{color:var(--mut);font-size:14px;font-weight:400}
button{font-family:inherit}
.scan{display:block;width:100%;padding:18px;border:0;border-radius:14px;background:var(--ac);color:#fff;font-size:17px;font-weight:600}
.scan[disabled]{opacity:.6}
input[type=file]{display:none}
#msg{min-height:22px;margin:10px 2px;color:var(--mut);font-size:14px}
#msg.err{color:var(--bad)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
li input{font:600 20px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;flex:1;min-width:0;width:100%;background:none;border:0;border-bottom:1px dashed transparent;color:var(--tx);padding:2px 0;text-transform:uppercase}
li input:focus{outline:0;border-bottom-color:var(--ac)}
li small{color:var(--mut);font-size:12px}
li button{background:none;border:0;color:var(--mut);font-size:20px;padding:4px 8px}
.row{display:flex;gap:8px;margin-top:14px}
.row button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:15px;font-weight:500}
.row .clr{color:var(--bad);flex:0 0 auto}
.cam{position:relative;margin-bottom:10px;border-radius:14px;overflow:hidden;background:#000;display:none;aspect-ratio:3.2/1}
.cam video{position:absolute;width:119.05%;left:-9.52%;top:50%;transform:translateY(-50%)}
.box{position:absolute;inset:0;border:3px solid var(--ac);border-radius:14px;pointer-events:none;transition:border-color .2s}
.box.ok{border-color:#3ddc84}
.alt{display:block;width:100%;padding:11px;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--mut);font-size:14px}
.empty{color:var(--mut);text-align:center;padding:28px 0}
</style>
</head>
<body>
<main>
<h1><div>Plates <em id="ver">v4</em></div><span id="count"></span></h1>
<div class="cam" id="cam"><video id="vid" playsinline muted></video><div class="box" id="box"></div></div>
<button class="scan" id="scan">📷 Start scanning</button>
<button class="alt" id="photo">or pick / take a photo instead</button>
<input type="file" id="file" accept="image/*" capture="environment">
<div id="msg"></div>
<ul id="list"></ul>
<div class="row" id="actions" hidden>
  <button id="exp">Export Excel</button>
  <button id="copy">Copy</button>
  <button id="clr" class="clr">Clear</button>
</div>
</main>
<script src="lib/tesseract.min.js"></script>
<script>
(function(){
var KEY="plates.v1",items=[],busy=false;
var $=function(id){return document.getElementById(id)};
try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){items=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function msg(t,err){var m=$("msg");m.textContent=t||"";m.className=err?"err":""}
function p2(n){return String(n).padStart(2,"0")}
function fmt(ts){var d=new Date(ts);return p2(d.getDate())+"/"+p2(d.getMonth()+1)+"/"+d.getFullYear()+" "+p2(d.getHours())+":"+p2(d.getMinutes())}
function render(){
  var ul=$("list");ul.textContent="";
  items.forEach(function(it,i){
    var li=document.createElement("li"),b=document.createElement("input"),s=document.createElement("small"),x=document.createElement("button");
    b.value=it.p;b.maxLength=8;b.autocapitalize="characters";b.spellcheck=false;b.setAttribute("aria-label","Edit plate");
    b.onchange=function(){var v=b.value.toUpperCase().replace(/[^A-Z0-9]/g,"");if(v){it.p=v;save()}b.value=it.p};
    s.textContent=fmt(it.t);x.textContent="✕";x.setAttribute("aria-label","Delete");
    x.onclick=function(){items.splice(i,1);save();render()};
    li.append(b,s,x);ul.append(li);
  });
  if(!items.length){var e=document.createElement("div");e.className="empty";e.textContent="No plates yet";ul.append(e)}
  $("count").textContent=items.length?items.length+" saved":"";
  $("actions").hidden=!items.length;
}

var L2D={O:"0",Q:"0",D:"0",I:"1",L:"1",Z:"2",S:"5",B:"8",G:"6"},D2L={"0":"O","1":"I","2":"Z","5":"S","8":"B","6":"G"};
function extract(text){
  var out=[];
  text.split(/\n/).forEach(function(line){
    var s=line.toUpperCase().replace(/[^A-Z0-9]/g,""),best=null;
    for(var i=0;i+7<=s.length;i++){
      var w=s.substr(i,7),fix=0,r="",ok=true;
      for(var j=0;j<7;j++){
        var ch=w[j],isD=/[0-9]/.test(ch);
        if(j<3){if(isD){if(!D2L[ch]){ok=false;break}ch=D2L[ch];fix++}}
        else if(j!==4){if(!isD){if(!L2D[ch]){ok=false;break}ch=L2D[ch];fix++}}
        r+=ch;
      }
      if(ok&&fix<=2&&(!best||fix<best.f))best={p:r,f:fix};
    }
    if(best&&out.indexOf(best.p)<0)out.push(best.p);
  });
  return out;
}
/* ---- image helpers ---- */
function mk(w,h){var c=document.createElement("canvas");c.width=w;c.height=h;return c}
/* crop (sx,sy,sw,sh) of source, scale to target width, grayscale + contrast stretch; returns {gray,bin} canvases */
function variants(src,sx,sy,sw,sh,tw){
  var sc=tw/sw,w=Math.round(sw*sc),h=Math.round(sh*sc),c=mk(w,h),g=c.getContext("2d");
  g.imageSmoothingQuality="high";g.drawImage(src,sx,sy,sw,sh,0,0,w,h);
  var d=g.getImageData(0,0,w,h),a=d.data,n=w*h,gr=new Uint8Array(n),hist=new Uint32Array(256),i,v;
  for(i=0;i<n;i++){v=a[i*4]*.299+a[i*4+1]*.587+a[i*4+2]*.114;gr[i]=v;hist[v|0]++}
  var lo=0,hi=255,acc=0;
  for(i=0;i<256;i++){acc+=hist[i];if(acc>n*.02){lo=i;break}}
  acc=0;for(i=255;i>=0;i--){acc+=hist[i];if(acc>n*.02){hi=i;break}}
  var k=255/Math.max(20,hi-lo);
  hist.fill(0);
  for(i=0;i<n;i++){v=(gr[i]-lo)*k;gr[i]=v<0?0:v>255?255:v;hist[gr[i]]++}
  /* Otsu */
  var tot=n,sum=0,sB=0,wB=0,mx=0,th=127;
  for(i=0;i<256;i++)sum+=i*hist[i];
  for(i=0;i<256;i++){wB+=hist[i];if(!wB)continue;var wF=tot-wB;if(!wF)break;sB+=i*hist[i];
    var mB=sB/wB,mF=(sum-sB)/wF,bt=wB*wF*(mB-mF)*(mB-mF);if(bt>mx){mx=bt;th=i}}
  var d2=g.createImageData(w,h),b=d2.data;
  for(i=0;i<n;i++){a[i*4]=a[i*4+1]=a[i*4+2]=gr[i];b[i*4]=b[i*4+1]=b[i*4+2]=gr[i]>th?255:0;b[i*4+3]=255}
  g.putImageData(d,0,0);
  var cb=mk(w,h),ink=new Uint8Array(n);cb.getContext("2d").putImageData(d2,0,0);
  for(i=0;i<n;i++)ink[i]=b[i*4]===0?1:0;
  return {gray:c,bin:cb,ink:ink,w:w,h:h};
}
function band(c){ /* centre 72% vertically: drops header and city text */
  var h=Math.round(c.height*.72),o=mk(c.width,h);
  o.getContext("2d").drawImage(c,0,Math.round(c.height*.14),c.width,h,0,0,c.width,h);return o;
}
/* ---- glyph-shape refinement: fixes I/L/1 and O/0 using the 7 glyph boxes ---- */
function glyphBoxes(ink,w,h){
  var seen=new Uint8Array(w*h),stack=new Int32Array(w*h),boxes=[],x,y;
  for(y=0;y<h;y++)for(x=0;x<w;x++){
    var s=y*w+x;if(!ink[s]||seen[s])continue;
    var sp=0,x0=x,x1=x,y0=y,y1=y;stack[sp++]=s;seen[s]=1;
    while(sp){
      var p=stack[--sp],px=p%w,py=(p-px)/w;
      if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py;
      if(px>0&&ink[p-1]&&!seen[p-1]){seen[p-1]=1;stack[sp++]=p-1}
      if(px<w-1&&ink[p+1]&&!seen[p+1]){seen[p+1]=1;stack[sp++]=p+1}
      if(py>0&&ink[p-w]&&!seen[p-w]){seen[p-w]=1;stack[sp++]=p-w}
      if(py<h-1&&ink[p+w]&&!seen[p+w]){seen[p+w]=1;stack[sp++]=p+w}
    }
    var bw=x1-x0+1,bh=y1-y0+1;
    if(bh>.3*h&&bh<.85*h&&bw<1.3*bh&&bw>.25*bh)boxes.push([x0,x1+1,y0,y1+1]);
  }
  if(boxes.length>7){
    var hs=boxes.map(function(b){return b[3]-b[2]}).sort(function(a,b){return a-b}),m=hs[hs.length>>1];
    boxes=boxes.filter(function(b){return Math.abs(b[3]-b[2]-m)<m*.15});
  }
  if(boxes.length!==7)return null;
  return boxes.sort(function(a,b){return a[0]-b[0]});
}
function maxRun(ink,w,x0,x1,y){var best=0,cur=0;for(var x=x0;x<x1;x++){if(ink[y*w+x]){cur++;if(cur>best)best=cur}else cur=0}return best}
function barRatio(ink,w,b,a0,a1){
  var bw=b[1]-b[0],bh=b[3]-b[2],ya=b[2]+Math.floor(bh*a0),yb=Math.max(ya+1,b[2]+Math.floor(bh*a1)),best=0;
  for(var y=ya;y<yb;y++){var r=maxRun(ink,w,b[0],b[1],y);if(r>best)best=r}
  return best/bw;
}
function cornerInk(ink,w,b,top,right){
  var bw=b[1]-b[0],bh=b[3]-b[2],cw=Math.floor(bw*.25),ch=Math.floor(bh*.2),
      x0=right?b[1]-cw:b[0],y0=top?b[2]:b[3]-ch,n=0;
  for(var y=y0;y<y0+ch;y++)for(var x=x0;x<x0+cw;x++)if(ink[y*w+x])n++;
  return n/Math.max(1,cw*ch);
}
function refine(plate,ink,w,h){
  var B=glyphBoxes(ink,w,h);if(!B)return plate;
  var out=plate.split("");
  for(var i=0;i<7;i++){
    var ch=out[i],b=B[i];
    if((i<3||i===4)&&(ch==="I"||ch==="L"||ch==="1")&&!(i===4&&ch==="1")){
      out[i]=barRatio(ink,w,b,0,.1)>=.45?"I":"L";
    }else if(i===4&&(ch==="O"||ch==="0")){
      var tl=cornerInk(ink,w,b,true,false),tr=cornerInk(ink,w,b,true,true),as=(tl-tr)/Math.max(.01,tl+tr);
      out[i]=as>=.27?"0":"O";
    }
  }
  return out.join("");
}

/* ---- OCR workers (two in parallel) ---- */
var W=null,WL="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
async function getWorkers(){
  if(W)return W;
  msg("Loading reader (first time only)…");
  var o={workerPath:"lib/worker.min.js",corePath:"lib/core/",langPath:"lib/lang/",gzip:true,cacheMethod:"none"};
  W=await Promise.all([Tesseract.createWorker("eng",1,o),Tesseract.createWorker("eng",1,o)]);
  return W;
}
async function ocr(w,c,psm){
  await w.setParameters({tessedit_pageseg_mode:psm,tessedit_char_whitelist:WL});
  var r=await w.recognize(c);return extract(r.data.text||"");
}
var P=Tesseract.PSM;
/* returns array of plate reads (one per pass) */
async function readCrop(src,sx,sy,sw,sh,flip){
  var w=await getWorkers(),v=variants(src,sx,sy,sw,sh,900);
  var r=await Promise.all([
    ocr(w[0],flip?v.bin:v.gray,P.SINGLE_BLOCK),
    ocr(w[1],band(flip?v.gray:v.bin),P.SINGLE_LINE)
  ]);
  return r.map(function(l){return l.map(function(p){return refine(p,v.ink,v.w,v.h)})});
}
function addPlate(p){
  if(items.some(function(i){return i.p===p}))return false;
  items.unshift({p:p,t:Date.now()});save();render();return true;
}
/* ---- live camera ---- */
var live=false,stream=null,hist=[],frame=0;
var vid=$("vid"),cam=$("cam"),box=$("box");
function layoutBox(){}
async function startLive(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false});
  }catch(e){msg("Camera blocked. Allow camera access, or use the photo option.",true);return}
  vid.srcObject=stream;await vid.play().catch(function(){});
  try{var t=stream.getVideoTracks()[0];await t.applyConstraints({advanced:[{focusMode:"continuous"}]})}catch(e){}
  cam.style.display="block";layoutBox();
  live=true;hist=[];$("scan").textContent="■ Stop";
  try{await getWorkers()}catch(e){msg("Could not load the reader.",true);stopLive();return}
  msg("Point the box at a plate and hold steady");
  loop();
}
function stopLive(){
  live=false;$("scan").textContent="📷 Start scanning";cam.style.display="none";
  if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
}
async function loop(){
  while(live){
    try{
      var vw=vid.videoWidth,vh=vid.videoHeight;
      if(!vw){await new Promise(function(r){setTimeout(r,100)});continue}
      var sw=vw*.84,sh=sw/3.2,sx=(vw-sw)/2,sy=(vh-sh)/2;
      var res=await readCrop(vid,sx,sy,sw,sh,frame++%2===1);
      if(!live)break;
      var votes=[].concat(res[0],res[1]);
      hist.push(votes);if(hist.length>5)hist.shift();
      var cnt={};hist.forEach(function(h){h.forEach(function(p){cnt[p]=(cnt[p]||0)+1})});
      for(var p in cnt){
        if(cnt[p]>=2){
          hist=[];
          if(addPlate(p)){
            if(navigator.vibrate)navigator.vibrate(120);
            box.classList.add("ok");setTimeout(function(){box.classList.remove("ok")},700);
            msg("Added "+p+" ✓");
          }else msg(p+" already in list");
          await new Promise(function(r){setTimeout(r,900)});
          break;
        }
      }
    }catch(e){await new Promise(function(r){setTimeout(r,300)})}
  }
}
/* ---- single photo (fallback) ---- */
async function analyze(file){
  if(busy)return;busy=true;$("scan").disabled=true;
  try{
    var w=await getWorkers();msg("Reading photo…");
    var img=await new Promise(function(res,rej){var i=new Image(),u=URL.createObjectURL(file);i.onload=function(){URL.revokeObjectURL(u);res(i)};i.onerror=rej;i.src=u});
    var found=[],s=Math.min(1,1600/Math.max(img.width,img.height)),W2=Math.round(img.width*s),H2=Math.round(img.height*s);
    var tries=[[0],[1]];
    for(var t=0;t<2&&!found.length;t++){
      var v=variants(img,0,0,img.width,img.height,W2),src=t?v.bin:v.gray;
      var r=await Promise.all([ocr(w[0],src,P.SPARSE_TEXT),ocr(w[1],src,P.SINGLE_BLOCK)]);
      found=[].concat(r[0],r[1]).filter(function(p,i,a){return a.indexOf(p)===i});
    }
    var added=0;found.forEach(function(p){if(addPlate(p))added++});
    msg(!found.length?"No plate found. Try the live scanner.":added?"Added "+added+" — check it":"Already in list",!found.length);
  }catch(e){msg("Could not read the image.",true)}
  finally{busy=false;$("scan").disabled=false}
}
$("scan").onclick=function(){live?stopLive():startLive()};
$("photo").onclick=function(){$("file").click()};
$("file").onchange=function(e){var f=e.target.files[0];e.target.value="";if(f)analyze(f)};
window.addEventListener("resize",layoutBox);
document.addEventListener("visibilitychange",function(){if(document.hidden&&live)stopLive()});
$("exp").onclick=async function(){
  var csv="\uFEFFPlate;Date\r\n"+items.slice().reverse().map(function(i){return i.p+";"+fmt(i.t)}).join("\r\n");
  var f=new File([csv],"plates.csv",{type:"text/csv"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}
  }catch(e){if(e&&e.name==="AbortError")return}
  var a=document.createElement("a");a.href=URL.createObjectURL(f);a.download="plates.csv";document.body.append(a);a.click();a.remove();
};
$("copy").onclick=async function(){
  var t=items.slice().reverse().map(function(i){return i.p}).join("\n");
  try{await navigator.clipboard.writeText(t);msg("Copied")}catch(e){msg("Copy failed",true)}
};
$("clr").onclick=function(){
  var b=$("clr");
  if(b.dataset.c){items=[];save();render();b.textContent="Clear";delete b.dataset.c;return}
  b.dataset.c=1;b.textContent="Tap again";
  setTimeout(function(){b.textContent="Clear";delete b.dataset.c},3000);
};
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
</html>
